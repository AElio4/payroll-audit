[project]
name = "payroll-audit"
version = "0.1.0"
description = "Check an installer's pay stub against their pay chart, with LLM extraction and security-first design."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.0", "pydantic>=2.7", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
payroll-audit = "payroll_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
